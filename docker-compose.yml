# T-705: `docker compose up --build` from a clean clone. Run scripts/demo/setup.sh first — it
# writes the .env file this compose file reads (a throwaway JWT keypair and a random local DB
# password, never committed). ES is the demo regime because it needs no external credentials
# (Verifactu doesn't remit anywhere, ADR-005) — CO's Factus adapter needs real sandbox
# credentials this repo doesn't ship.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: tributary-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRIBUTARY_DB_URL: ${TRIBUTARY_DB_URL}
      TRIBUTARY_DB_USERNAME: ${TRIBUTARY_DB_USERNAME}
      TRIBUTARY_DB_PASSWORD: ${TRIBUTARY_DB_PASSWORD}
      TRIBUTARY_JWT_PUBLIC_KEY: ${TRIBUTARY_JWT_PUBLIC_KEY}
      TRIBUTARY_ALLOWED_HOSTS: ${TRIBUTARY_ALLOWED_HOSTS}
      TRIBUTARY_CORS_ALLOWED_ORIGINS: ${TRIBUTARY_CORS_ALLOWED_ORIGINS}
      TRIBUTARY_REGIME: ${TRIBUTARY_REGIME}
      TRIBUTARY_SERVER_PORT: ${TRIBUTARY_SERVER_PORT}
    ports:
      - "8080:8080"
