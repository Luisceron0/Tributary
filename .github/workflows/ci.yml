name: CI

# T-704 / SRS §9C fase 7: "CI con SAST, SCA, secrets scanning y la matriz de verificación de
# §9A." Four independent jobs so a failure in one (e.g. a new dependency CVE) doesn't hide a
# regression in another. Each job title below cites the §9A control ID it corresponds to; §9A
# itself lives in docs/SRS-tributary.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CV-07 (ArchUnit) plus the full test suite (property-based, Testcontainers, ArchUnit,
  # integration) — the "Funcional" phase of §9B.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: CV-07 — domain isolation (ArchUnit)
        run: mvn test -pl tributary-api -am -Dtest=ArchitectureTest

      - name: Full test suite (all 8 modules)
        run: mvn test

  # SAST: this project's own three rules (validated against deliberately-vulnerable fixtures
  # first, T-703) plus a broad, general-purpose ruleset for everything those three don't cover.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Tributary custom rules (proven against fixtures first)
        run: ./scripts/run-semgrep.sh

      # Scoped to the same 7 Java modules the custom-rules step above scans — never
      # .semgrep/fixtures/, which is deliberately vulnerable on purpose (see run-semgrep.sh) and
      # would otherwise fail this broad ruleset every single run for the wrong reason.
      - name: General Java security ruleset
        run: |
          semgrep --config p/java --config p/owasp-top-ten --error \
            tributary-domain tributary-application tributary-adapter-co-factus \
            tributary-adapter-es-verifactu tributary-adapter-de-en16931 tributary-persistence tributary-api

  # SCA: no HIGH/CRITICAL dependency finding is allowed to merge (Definition of Done). Pinned
  # exact versions (SRS 5.3) still drift into newly-disclosed CVEs over time — see lessons.md
  # L-028 — so this runs on every push/PR, not just once at pin time.
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # T-805: one scan covers both ecosystems — trivy picks up every pom.xml AND
      # tributary-web/package-lock.json from the repo root. --include-dev-deps matters here:
      # trivy suppresses npm dev dependencies by default, and in this project the build toolchain
      # (Vite, the OpenAPI generator, the type checker) is exactly the supply chain that produces
      # the artifact users receive, so a compromise there is not "only a dev dependency".
      - name: Trivy dependency scan — Maven + npm (HIGH/CRITICAL blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"

  # T-801/T-805: the frontend build is where the OpenAPI contract stops being documentation. The
  # client types are REGENERATED from docs/openapi.json here and the build must still pass — so a
  # contract that drifted away from what the frontend consumes fails CI, exactly like a broken
  # test. Verified by falsifiability: renaming a field in the contract produced TS2339 at the
  # precise call site.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tributary-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: tributary-web/package-lock.json

      # `npm ci` fails if package.json and package-lock.json disagree — which is also the check
      # that the exact-version pins (SRS 5.3) have not drifted.
      - name: Install (locked)
        run: npm ci

      - name: Regenerate the API client from the committed contract
        run: npm run generate:api

      - name: Fail if the generated client differs from what is committed
        run: git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Build (type-checks against the contract)
        run: npm run build

  # CV-06: 0 findings, full history, not just the diff (the pre-commit hook already covers the
  # diff at commit time — see .githooks/pre-commit — this is the independent, fail-closed check
  # against everything that ever reached the branch).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version + checksum)
        run: ./scripts/install-gitleaks.sh

      - name: CV-06 — gitleaks detect
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          gitleaks detect --source . --redact --no-banner
