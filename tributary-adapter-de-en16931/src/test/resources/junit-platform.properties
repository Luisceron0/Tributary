# Toolchain Q: cucumber-junit-platform-engine is inherited repo-wide (root pom) for Gherkin
# support, but most modules have no feature files. Without this, Surefire's default JUnit
# Platform discovery runs Cucumber as a bare "root engine" and it fails hard rather than finding
# 0 scenarios, breaking `mvn test` in every module that doesn't use it. This confines Cucumber to
# running only when explicitly included via a @Suite class with @IncludeEngines("cucumber")
# (see tributary-domain's RunCucumberTest) — never as an implicit root engine.
cucumber.junit-platform.discovery.as-root-engine=false
