# T-906. Differs from the dev docker-compose.yml (T-705) in exactly the ways §10.5 requires:
#   - Caddy terminates TLS and is the only container publishing ports to the host.
#   - postgres and api are internal-only — unreachable from outside the docker network, which is
#     also the reason it is safe for the api container to trust X-Forwarded-Proto/-For from
#     anywhere on this network at all: nothing else can reach it to forge the header.
#   - The edge network has a FIXED subnet so Caddy's address is deterministic, not whatever
#     Docker's bridge driver happens to assign this run — TRIBUTARY_TRUSTED_PROXIES in .env pins
#     that exact address, the one thing ClientIpResolver (T-901) is configured to trust.
#   - Named volume for Postgres data, and a `deploy/reset.sh` (run by a systemd timer, see
#     docs/deployment.md) that tears it down and recreates it on a schedule — this is a public demo
#     with synthetic data and no administrator credential (ADR-010, T-904), not a system meant to
#     accumulate real state.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - edge
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: tributary-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRIBUTARY_DB_URL: ${TRIBUTARY_DB_URL}
      TRIBUTARY_DB_USERNAME: ${TRIBUTARY_DB_USERNAME}
      TRIBUTARY_DB_PASSWORD: ${TRIBUTARY_DB_PASSWORD}
      TRIBUTARY_JWT_PUBLIC_KEY: ${TRIBUTARY_JWT_PUBLIC_KEY}
      TRIBUTARY_ALLOWED_HOSTS: ${TRIBUTARY_ALLOWED_HOSTS}
      # Empty on purpose: same-origin through Caddy needs no cross-origin allowance at all — a
      # smaller attack surface than CORS, not a relaxed one (see deploy/Caddyfile).
      TRIBUTARY_CORS_ALLOWED_ORIGINS: ""
      TRIBUTARY_REGIME: ES
      TRIBUTARY_SERVER_PORT: 8080
      # T-901: the only address this deployment trusts X-Forwarded-For from — Caddy's fixed
      # address on the edge network, below.
      TRIBUTARY_TRUSTED_PROXIES: ${TRIBUTARY_TRUSTED_PROXIES}
      TRIBUTARY_RATE_LIMIT_PER_IP: ${TRIBUTARY_RATE_LIMIT_PER_IP:-120}
      TRIBUTARY_RATE_LIMIT_PER_CLIENT: ${TRIBUTARY_RATE_LIMIT_PER_CLIENT:-60}
    networks:
      - edge
    restart: unless-stopped
    # No `ports:` — intentional. Nothing but Caddy, on the same docker network, can reach this.

  edge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge
      args:
        VITE_DEMO_TOKEN_OPERATOR: ${VITE_DEMO_TOKEN_OPERATOR}
        VITE_DEMO_TOKEN_AUDITOR: ${VITE_DEMO_TOKEN_AUDITOR}
    depends_on:
      - api
    environment:
      TRIBUTARY_DOMAIN: ${TRIBUTARY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
