# Every value that varies by environment comes from an env var, never a literal default baked in
# here for anything credential-shaped (SRS 5.3) — spring.datasource.* and
# tributary.security.jwt.public-key have NO default: a missing one fails the app at startup,
# not with a silently-empty value.

spring:
  application:
    name: tributary-api

tributary:
  regime: ${TRIBUTARY_REGIME:ES}
  datasource:
    url: ${TRIBUTARY_DB_URL}
    username: ${TRIBUTARY_DB_USERNAME}
    password: ${TRIBUTARY_DB_PASSWORD}
  security:
    jwt:
      public-key: ${TRIBUTARY_JWT_PUBLIC_KEY}
    # Host header allowlist (SRS 5.3) has no default either — an operator must say explicitly
    # which hostnames this deployment answers to; comma-separated.
    allowed-hosts: ${TRIBUTARY_ALLOWED_HOSTS}
    # CORS allowlist (SRS 5.3: "nunca comodín"). Empty by default is a real value, not a missing
    # one — though since ADR-010 a browser origin does exist, so a deployment serving the frontend
    # sets this explicitly (scripts/demo/setup.sh does).
    cors-allowed-origins: ${TRIBUTARY_CORS_ALLOWED_ORIGINS:}
    # T-900 / §10.5: inbound rate limiting, per IP and per client, answering 429 — the status code
    # §6.5 has always declared for the issuance route. Keyed on getRemoteAddr(), NOT on
    # X-Forwarded-For: honouring that header before T-901 establishes a trusted proxy would let
    # anyone bypass the limit by forging it.
    rate-limit:
      per-ip-per-minute: ${TRIBUTARY_RATE_LIMIT_PER_IP:120}
      per-client-per-minute: ${TRIBUTARY_RATE_LIMIT_PER_CLIENT:60}
    # T-901 / §5.3 / §10.5: X-Forwarded-For is honoured ONLY when the connection arrives from one
    # of these addresses; otherwise the client-supplied value is discarded. Empty by default, which
    # means the header is ignored entirely — a deployment that has not declared its proxy gets the
    # direct socket address, which is always true even if less informative. Comma-separated.
    trusted-proxies: ${TRIBUTARY_TRUSTED_PROXIES:}

server:
  port: ${TRIBUTARY_SERVER_PORT:8080}

# T-701: structured JSON logs (Spring Boot's built-in ECS formatter — no extra dependency), and
# debug logging OFF by configuration, not by discipline (SRS 5.3's own wording, applied to logging
# exactly the way T-309's fail-closed environment guard already applies it to the Factus
# production URL).
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

# T-707: OpenAPI 3.1 output explicitly (springdoc defaults to 3.0). No Swagger UI (ADR-006).
springdoc:
  api-docs:
    version: openapi_3_1
    path: /v3/api-docs
